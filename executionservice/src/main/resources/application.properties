# Laufzeit-Paritaet zum Boot-1.3.5/RESTEasy-3-Stand (Etappe 4, Task 6).
# Alles Uebrige bleibt wie bisher bei @Value-Defaults und -D-System-Properties.

# Boot 1.3 erzwang per Default (spring.http.encoding.force=true) charset=UTF-8 auf JEDER
# Antwort (auch application/ld+json, application/octet-stream). Boot 4 erzwingt es nur noch
# fuer Requests; das hier stellt das alte Antwortverhalten wieder her.
spring.servlet.encoding.force=true

# Ruling R9 (Etappe 4, Final-Review): Boot 1.3 schrieb Fehlergrund und Exception-Klasse in den
# 500-Body (XML-Map); Boot 4 laesst beides per Default weg. Wiederhergestellt (Format jetzt JSON).
# Boot 4 hat server.error.* nach spring.web.error.* verschoben (alter Schluessel: Deprecation
# level "error", wird ignoriert).
spring.web.error.include-message=always
spring.web.error.include-exception=true

# Ruling R10: Undertow 1.3 erlaubte 1MB Request-Header, Tomcat 11 nur 8KB per Default.
# (Kodiertes Slash: s. TomcatConfiguration. Keep-Alive-Defaults von Tomcat sind akzeptiert.)
server.max-http-request-header-size=1MB
